<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCFAF5"/>
      <stop offset="60%" stop-color="#F5EFE0"/>
      <stop offset="100%" stop-color="#E9DEC6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#FFEBB8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F5EFE0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="diyaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFDD77" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#FFA834" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF7A00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="deepamOil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D98A18"/>
      <stop offset="35%" stop-color="#F7BA31"/>
      <stop offset="70%" stop-color="#E8A322"/>
      <stop offset="100%" stop-color="#B26C08"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="15%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="85%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A87522"/>
      <stop offset="50%" stop-color="#E8BE58"/>
      <stop offset="100%" stop-color="#8E5E14"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#3A2810" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>
  <circle cx="300" cy="330" r="230" fill="url(#glow)"/>

  <!-- Pedestal shadow -->
  <ellipse cx="300" cy="510" rx="140" ry="24" fill="#3A2810" opacity="0.14"/>
  <ellipse cx="300" cy="508" rx="100" ry="14" fill="#3A2810" opacity="0.22"/>

  <!-- Bottle Group -->
  <g filter="url(#shadow)">
    <!-- Cap (Golden Brass) -->
    <rect x="272" y="105" width="56" height="30" rx="5" fill="url(#brass)"/>
    <rect x="268" y="130" width="64" height="10" rx="3" fill="#69460D"/>
    
    <!-- Neck & Bottle -->
    <path d="M 276 138 L 276 210 Q 276 240 230 265 L 210 278 L 210 490 Q 210 500 225 500 L 375 500 Q 390 500 390 490 L 390 278 L 370 265 Q 324 240 324 210 L 324 138 Z" fill="url(#deepamOil)"/>
    <path d="M 276 138 L 276 210 Q 276 240 230 265 L 210 278 L 210 490 Q 210 500 225 500 L 375 500 Q 390 500 390 490 L 390 278 L 370 265 Q 324 240 324 210 L 324 138 Z" fill="url(#glass)"/>

    <!-- Light reflection streak -->
    <path d="M 224 285 L 224 485 Q 224 492 230 492 L 236 492 L 236 285 Z" fill="#FFFFFF" opacity="0.55"/>

    <!-- Label -->
    <rect x="225" y="300" width="150" height="160" rx="6" fill="#FFFDF8" stroke="#E5D9C4" stroke-width="1.5"/>
    <rect x="233" y="308" width="134" height="144" rx="4" fill="none" stroke="#C49A45" stroke-width="1"/>
    
    <!-- Label Typography -->
    <text x="300" y="332" font-family="'Playfair Display', serif, Georgia" font-size="15" font-weight="700" fill="#141612" text-anchor="middle" letter-spacing="1.5">VS ORGANIC</text>
    <text x="300" y="347" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#9E6F1B" text-anchor="middle" letter-spacing="1.5">PANCHA DEEPAM</text>
    <line x1="250" y1="355" x2="350" y2="355" stroke="#C4A05B" stroke-width="0.8"/>
    <text x="300" y="378" font-family="'Playfair Display', serif" font-size="14" font-weight="700" fill="#141612" text-anchor="middle">POOJA DEEPAM OIL</text>
    <text x="300" y="396" font-family="'Noto Sans Tamil', sans-serif" font-size="11" font-weight="600" fill="#845010" text-anchor="middle">தீபம் எண்ணெய்</text>
    <text x="300" y="415" font-family="sans-serif" font-size="8" fill="#5F6652" text-anchor="middle">5 SACRED OILS BLEND</text>
    <rect x="255" y="425" width="90" height="18" rx="9" fill="#FCEAC7"/>
    <text x="300" y="437" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#9E6F1B" text-anchor="middle">DIVINE AROMA</text>
  </g>

  <!-- Brass Diya Lamp with Flame Foreground -->
  <g>
    <!-- Diya Glow -->
    <circle cx="185" cy="495" r="30" fill="url(#diyaGlow)"/>

    <!-- Brass Diya Bowl -->
    <path d="M 160 512 Q 185 528 210 512 Q 200 522 185 524 Q 170 522 160 512 Z" fill="url(#brass)"/>
    <ellipse cx="185" cy="512" rx="25" ry="6" fill="#845010"/>

    <!-- Diya Flame -->
    <path d="M 185 482 Q 192 495 188 506 Q 185 510 182 506 Q 178 495 185 482 Z" fill="#FFA500"/>
    <path d="M 185 488 Q 189 497 186 504 Q 185 506 183 504 Q 181 497 185 488 Z" fill="#FFF275"/>
  </g>
</svg>