<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDFBF5"/>
      <stop offset="60%" stop-color="#F7EEDC"/>
      <stop offset="100%" stop-color="#EADBBE"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#FFF3C4" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F7EEDC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mustardOil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C98808"/>
      <stop offset="35%" stop-color="#F5B818"/>
      <stop offset="70%" stop-color="#E5A610"/>
      <stop offset="100%" stop-color="#A56E05"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="15%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="85%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5C381E"/>
      <stop offset="50%" stop-color="#8C5832"/>
      <stop offset="100%" stop-color="#4A2D16"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#3A2810" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>
  <circle cx="300" cy="330" r="230" fill="url(#glow)"/>

  <!-- Pedestal shadow -->
  <ellipse cx="300" cy="510" rx="140" ry="24" fill="#3A2810" opacity="0.14"/>
  <ellipse cx="300" cy="508" rx="100" ry="14" fill="#3A2810" opacity="0.22"/>

  <!-- Bottle Group -->
  <g filter="url(#shadow)">
    <!-- Cap -->
    <rect x="272" y="105" width="56" height="30" rx="5" fill="url(#wood)"/>
    <rect x="268" y="130" width="64" height="10" rx="3" fill="#3D2310"/>
    
    <!-- Neck & Bottle -->
    <path d="M 276 138 L 276 210 Q 276 240 230 265 L 210 278 L 210 490 Q 210 500 225 500 L 375 500 Q 390 500 390 490 L 390 278 L 370 265 Q 324 240 324 210 L 324 138 Z" fill="url(#mustardOil)"/>
    <path d="M 276 138 L 276 210 Q 276 240 230 265 L 210 278 L 210 490 Q 210 500 225 500 L 375 500 Q 390 500 390 490 L 390 278 L 370 265 Q 324 240 324 210 L 324 138 Z" fill="url(#glass)"/>

    <!-- Light reflection streak -->
    <path d="M 224 285 L 224 485 Q 224 492 230 492 L 236 492 L 236 285 Z" fill="#FFFFFF" opacity="0.55"/>

    <!-- Label -->
    <rect x="225" y="300" width="150" height="160" rx="6" fill="#FFFDF8" stroke="#E3DAC8" stroke-width="1.5"/>
    <rect x="233" y="308" width="134" height="144" rx="4" fill="none" stroke="#D1B888" stroke-width="1"/>
    
    <!-- Label Typography -->
    <text x="300" y="332" font-family="'Playfair Display', serif, Georgia" font-size="15" font-weight="700" fill="#141612" text-anchor="middle" letter-spacing="1.5">VS ORGANIC</text>
    <text x="300" y="347" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#9E6F1B" text-anchor="middle" letter-spacing="1.5">WOOD PRESSED</text>
    <line x1="250" y1="355" x2="350" y2="355" stroke="#C4A05B" stroke-width="0.8"/>
    <text x="300" y="378" font-family="'Playfair Display', serif" font-size="14" font-weight="700" fill="#141612" text-anchor="middle">MUSTARD OIL</text>
    <text x="300" y="396" font-family="'Noto Sans Tamil', sans-serif" font-size="11" font-weight="600" fill="#7A4D12" text-anchor="middle">கடுகு எண்ணெய்</text>
    <text x="300" y="415" font-family="sans-serif" font-size="8" fill="#5F6652" text-anchor="middle">PUNGENT &amp; NATURAL</text>
    <rect x="255" y="425" width="90" height="18" rx="9" fill="#FFF0C7"/>
    <text x="300" y="437" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#9E6F1B" text-anchor="middle">100% PURE CHEKKU</text>
  </g>

  <!-- Mustard Seeds Foreground Clustered -->
  <g>
    <!-- Dark & golden seeds -->
    <circle cx="170" cy="515" r="4.5" fill="#3D2007"/>
    <circle cx="180" cy="518" r="4" fill="#C98808"/>
    <circle cx="175" cy="524" r="5" fill="#241303"/>
    <circle cx="190" cy="520" r="4.2" fill="#E5A610"/>
    <circle cx="200" cy="526" r="4.8" fill="#3D2007"/>
    <circle cx="185" cy="528" r="4" fill="#A56E05"/>

    <circle cx="400" cy="516" r="4.5" fill="#C98808"/>
    <circle cx="410" cy="514" r="5" fill="#3D2007"/>
    <circle cx="418" cy="522" r="4.2" fill="#E5A610"/>
    <circle cx="428" cy="525" r="4.8" fill="#241303"/>
    <circle cx="405" cy="527" r="4" fill="#A56E05"/>
  </g>
</svg>