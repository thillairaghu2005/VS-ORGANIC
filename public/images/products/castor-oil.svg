<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBF8F3"/>
      <stop offset="60%" stop-color="#F4EDE2"/>
      <stop offset="100%" stop-color="#E9DEC9"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#FCEFD5" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F4EDE2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="oil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D99E32"/>
      <stop offset="35%" stop-color="#F5C452"/>
      <stop offset="70%" stop-color="#E5AD38"/>
      <stop offset="100%" stop-color="#B8781B"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="15%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="85%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5C381E"/>
      <stop offset="50%" stop-color="#8C5832"/>
      <stop offset="100%" stop-color="#4A2D16"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#3A2810" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>
  <circle cx="300" cy="330" r="230" fill="url(#glow)"/>

  <!-- Pedestal shadow -->
  <ellipse cx="300" cy="510" rx="140" ry="24" fill="#3A2810" opacity="0.14"/>
  <ellipse cx="300" cy="508" rx="100" ry="14" fill="#3A2810" opacity="0.22"/>

  <!-- Bottle Group -->
  <g filter="url(#shadow)">
    <!-- Bottle Body Filled with Castor Oil -->
    <!-- Cap -->
    <rect x="272" y="105" width="56" height="30" rx="5" fill="url(#wood)"/>
    <rect x="268" y="130" width="64" height="10" rx="3" fill="#3D2310"/>
    
    <!-- Neck -->
    <path d="M 276 138 L 276 210 Q 276 240 230 265 L 210 278 L 210 490 Q 210 500 225 500 L 375 500 Q 390 500 390 490 L 390 278 L 370 265 Q 324 240 324 210 L 324 138 Z" fill="url(#oil)"/>
    <path d="M 276 138 L 276 210 Q 276 240 230 265 L 210 278 L 210 490 Q 210 500 225 500 L 375 500 Q 390 500 390 490 L 390 278 L 370 265 Q 324 240 324 210 L 324 138 Z" fill="url(#glass)"/>

    <!-- Light reflection streak -->
    <path d="M 224 285 L 224 485 Q 224 492 230 492 L 236 492 L 236 285 Z" fill="#FFFFFF" opacity="0.55"/>

    <!-- Label -->
    <rect x="225" y="300" width="150" height="160" rx="6" fill="#FFFDF8" stroke="#E3DAC8" stroke-width="1.5"/>
    <rect x="233" y="308" width="134" height="144" rx="4" fill="none" stroke="#D1B888" stroke-width="1"/>
    
    <!-- Label Typography -->
    <text x="300" y="332" font-family="'Playfair Display', serif, Georgia" font-size="15" font-weight="700" fill="#141612" text-anchor="middle" letter-spacing="1.5">VS ORGANIC</text>
    <text x="300" y="347" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#9E6F1B" text-anchor="middle" letter-spacing="1.5">COLD PRESSED</text>
    <line x1="250" y1="355" x2="350" y2="355" stroke="#C4A05B" stroke-width="0.8"/>
    <text x="300" y="378" font-family="'Playfair Display', serif" font-size="14" font-weight="700" fill="#141612" text-anchor="middle">CASTOR OIL</text>
    <text x="300" y="396" font-family="'Noto Sans Tamil', sans-serif" font-size="11" font-weight="600" fill="#7A4D12" text-anchor="middle">விளக்கெண்ணெய்</text>
    <text x="300" y="415" font-family="sans-serif" font-size="8" fill="#5F6652" text-anchor="middle">100% PURE &amp; NATURAL</text>
    <rect x="255" y="425" width="90" height="18" rx="9" fill="#F8EED7"/>
    <text x="300" y="437" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#9E6F1B" text-anchor="middle">VAAGAI CHEKKU</text>
  </g>

  <!-- Castor Seeds Foreground -->
  <g>
    <ellipse cx="180" cy="510" rx="16" ry="11" fill="#704423" transform="rotate(-15 180 510)"/>
    <ellipse cx="180" cy="508" rx="13" ry="8" fill="#A36B3B" transform="rotate(-15 180 508)"/>
    <ellipse cx="178" cy="506" rx="4" ry="2" fill="#E8C79E"/>

    <ellipse cx="205" cy="522" rx="15" ry="10" fill="#5C3417" transform="rotate(25 205 522)"/>
    <ellipse cx="205" cy="520" rx="12" ry="7" fill="#8C562B" transform="rotate(25 205 520)"/>

    <ellipse cx="400" cy="515" rx="17" ry="12" fill="#6B3E1D" transform="rotate(-30 400 515)"/>
    <ellipse cx="400" cy="513" rx="14" ry="9" fill="#9C6233" transform="rotate(-30 400 513)"/>
    <ellipse cx="425" cy="520" rx="14" ry="10" fill="#543015" transform="rotate(10 425 520)"/>
  </g>
</svg>
