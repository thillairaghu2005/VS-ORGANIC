<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F9FBF6"/>
      <stop offset="60%" stop-color="#EEF4E8"/>
      <stop offset="100%" stop-color="#DCE6D2"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#E2F0D8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#EEF4E8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neemOil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4E681C"/>
      <stop offset="35%" stop-color="#7B992C"/>
      <stop offset="70%" stop-color="#678322"/>
      <stop offset="100%" stop-color="#3D5314"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="15%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="85%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#423424"/>
      <stop offset="50%" stop-color="#69563E"/>
      <stop offset="100%" stop-color="#33271A"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#243015" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>
  <circle cx="300" cy="330" r="230" fill="url(#glow)"/>

  <!-- Pedestal shadow -->
  <ellipse cx="300" cy="510" rx="140" ry="24" fill="#243015" opacity="0.14"/>
  <ellipse cx="300" cy="508" rx="100" ry="14" fill="#243015" opacity="0.22"/>

  <!-- Bottle Group -->
  <g filter="url(#shadow)">
    <!-- Cap -->
    <rect x="272" y="105" width="56" height="30" rx="5" fill="url(#wood)"/>
    <rect x="268" y="130" width="64" height="10" rx="3" fill="#2B2114"/>
    
    <!-- Neck & Bottle -->
    <path d="M 276 138 L 276 210 Q 276 240 230 265 L 210 278 L 210 490 Q 210 500 225 500 L 375 500 Q 390 500 390 490 L 390 278 L 370 265 Q 324 240 324 210 L 324 138 Z" fill="url(#neemOil)"/>
    <path d="M 276 138 L 276 210 Q 276 240 230 265 L 210 278 L 210 490 Q 210 500 225 500 L 375 500 Q 390 500 390 490 L 390 278 L 370 265 Q 324 240 324 210 L 324 138 Z" fill="url(#glass)"/>

    <!-- Light reflection streak -->
    <path d="M 224 285 L 224 485 Q 224 492 230 492 L 236 492 L 236 285 Z" fill="#FFFFFF" opacity="0.55"/>

    <!-- Label -->
    <rect x="225" y="300" width="150" height="160" rx="6" fill="#FFFDF8" stroke="#D7E0CF" stroke-width="1.5"/>
    <rect x="233" y="308" width="134" height="144" rx="4" fill="none" stroke="#9EAF8C" stroke-width="1"/>
    
    <!-- Label Typography -->
    <text x="300" y="332" font-family="'Playfair Display', serif, Georgia" font-size="15" font-weight="700" fill="#141612" text-anchor="middle" letter-spacing="1.5">VS ORGANIC</text>
    <text x="300" y="347" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#3E5C1B" text-anchor="middle" letter-spacing="1.5">COLD PRESSED</text>
    <line x1="250" y1="355" x2="350" y2="355" stroke="#7A9A4A" stroke-width="0.8"/>
    <text x="300" y="378" font-family="'Playfair Display', serif" font-size="14" font-weight="700" fill="#141612" text-anchor="middle">PURE NEEM OIL</text>
    <text x="300" y="396" font-family="'Noto Sans Tamil', sans-serif" font-size="11" font-weight="600" fill="#2E4413" text-anchor="middle">வேப்பெண்ணெய்</text>
    <text x="300" y="415" font-family="sans-serif" font-size="8" fill="#5F6652" text-anchor="middle">NATIVE VELLAI VEPPAM</text>
    <rect x="255" y="425" width="90" height="18" rx="9" fill="#E4EFD8"/>
    <text x="300" y="437" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#335013" text-anchor="middle">100% THERAPEUTIC</text>
  </g>

  <!-- Neem Leaves Foreground -->
  <g>
    <!-- Left Leaf Branch -->
    <path d="M 160 520 Q 185 500 215 508 Q 195 525 160 520 Z" fill="#4B6A1A"/>
    <path d="M 180 505 Q 200 488 225 496 Q 208 510 180 505 Z" fill="#648827"/>
    <path d="M 150 515 Q 170 495 190 500 Q 175 515 150 515 Z" fill="#3B5412"/>

    <!-- Right Leaf Branch -->
    <path d="M 430 520 Q 405 500 375 508 Q 395 525 430 520 Z" fill="#4B6A1A"/>
    <path d="M 410 505 Q 390 488 365 496 Q 382 510 410 505 Z" fill="#648827"/>
  </g>
</svg>